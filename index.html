<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studiu Medicină</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>" />
  <script src="vendor/mammoth.browser.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">🩺 <span>Studiu Medicină</span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="surse" class="active">Surse</button>
      <button data-tab="capitole">Capitole</button>
      <button data-tab="repetitie">Repetiție</button>
      <button data-tab="grile">Banca de grile</button>
      <button data-tab="antrenament">Test</button>
      <button data-tab="cazuri">Cazuri</button>
      <button data-tab="recall">Recall</button>
      <button data-tab="explicatii">Explicații</button>
      <button data-tab="sinteze">Sinteze</button>
      <button data-tab="podcast">Podcast</button>
      <button data-tab="metoda">Metodă</button>
      <button data-tab="setari">Setări</button>
    </nav>
  </header>

  <main id="view"></main>

  <aside id="jobs" class="jobs hidden">
    <div class="jobs-head"><strong>Activitate <span class="muted small" id="jobs-count"></span></strong><span><button class="ghost small" id="jobs-min" title="Minimizează">—</button> <button class="ghost small" id="jobs-close" title="Închide ce s-a terminat">✕</button></span></div>
    <div id="jobs-list"></div>
  </aside>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
